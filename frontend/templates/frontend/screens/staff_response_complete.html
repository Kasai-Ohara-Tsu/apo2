<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>送信完了</title>
    <style>
        :root {
            --bg: #00736c;
            --card: #ffffff;
            --text: #1f2937;
            --primary: #2563eb;
            --radius: 14px;
            --shadow: 0 8px 30px rgba(0, 0, 0, .08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(24px, 4vw, 48px);
            max-width: 500px;
            text-align: center;
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(20px, 3vw, 28px);
            margin: 0 0 16px;
            color: var(--primary);
        }

        p {
            color: var(--text);
            margin: 0;
            font-size: 1rem;
        }

        .close-instruction {
            margin-top: 24px;
            font-size: 0.9rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">✅</div>
        <h1>送信完了</h1>
        <p>{{ message }}</p>
        <p class="close-instruction">このタブを閉じていただいて構いません。</p>
    </div>
</body>
</html>
