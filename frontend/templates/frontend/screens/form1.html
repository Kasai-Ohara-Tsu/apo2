<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>来訪者対応フォーム</title>
    <style>
        :root {
            --bg: #00736c;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --ring: #93c5fd;
            --border: #e5e7eb;
            --danger: #ef4444;
            --radius: 14px;
            --shadow: 0 8px 30px rgba(0, 0, 0, .08);
            --space: 14px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #00736c;
                --card: #ffffff;
                --text: #000000;
                --muted: #9ca3af;
                --primary: #60a5fa;
                --primary-hover: #3b82f6;
                --ring: #3b82f6;
                --border: #1f2937;
                --shadow: 0 8px 30px rgba(0, 0, 0, .35);
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
        }

        .wrap {
            max-width: 720px;
            margin: clamp(18px, 4vw, 48px) auto;
            padding: 0 16px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: clamp(18px, 3.5vw, 28px);
        }

        h1 {
            font-size: clamp(22px, 2.6vw, 32px);
            margin: 0 0 18px;
            letter-spacing: .02em;
        }

        .desc {
            color: var(--muted);
            margin: -6px 0 18px;
            font-size: 0.95rem;
        }

        /* radio を見た目ボタン化（実体はそのまま保持） */
        .choices {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 10px 0 6px;
        }

        .choice {
            position: relative;
        }

        .choice input[type="radio"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .choice label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: linear-gradient(#fff0, #fff0);
            color: var(--text);
            transition: .15s ease-in-out;
            user-select: none;
        }

        .choice label::before {
            content: "";
            width: 14px;
            height: 14px;
            border-radius: 999px;
            border: 2px solid var(--muted);
            background: transparent;
            display: inline-block;
            transition: .15s;
        }

        .choice input[type="radio"]:checked+label {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent);
        }

        .choice input[type="radio"]:checked+label::before {
            border-color: var(--primary);
            box-shadow: inset 0 0 0 4px var(--card), inset 0 0 0 8px var(--primary);
        }

        .choice input[type="radio"]:focus-visible+label {
            outline: 2px solid var(--ring);
            outline-offset: 2px;
        }

        .field {
            margin-top: 18px;
        }

        .label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .optional {
            color: var(--muted);
            font-weight: 400;
            margin-left: 6px;
            font-size: .95em;
        }

        textarea {
            width: 100%;
            min-height: 140px;
            resize: vertical;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text);
            font-size: 1rem;
            transition: .15s;
        }

        textarea::placeholder {
            color: var(--muted)
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 35%, transparent);
        }

        .actions {
            margin-top: 22px;
            display: flex;
            gap: 10px;
        }

        .btn {
            appearance: none;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: .15s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            filter: saturate(.6);
            opacity: .7;
            cursor: not-allowed;
            transform: none;
        }

        /* ヘルプテキスト／エラー想定 */
        .help {
            color: var(--muted);
            font-size: .92rem;
            margin-top: 6px;
        }

        .error {
            color: var(--danger);
        }

        /* 細かなレスポンシブ */
        @media (max-width:420px) {
            .choices {
                gap: 8px
            }

            .btn {
                width: 100%
            }

            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="card">
            <h1>来訪者対応フォーム</h1>
            <p class="desc">来訪者への一次連絡にお使いください。選択後にメッセージを添えて送信できます。</p>

            <form action="{% url 'frontend:handle_form_submission' %}?staff_id={{ staff.id }}&visitor_name={{ visitor_name|urlencode }}&visitor_company={{ visitor_company|urlencode }}" method="post" id="visitForm" novalidate>
                {% csrf_token %}
                <div class="label">対応可否</div>
                <div class="choices" role="radiogroup" aria-label="対応可否">
                    <div class="choice">
                        <input type="radio" id="ok" name="availability" value="A">
                        <label for="ok">A：対応可能</label>
                    </div>
                    <div class="choice">
                        <input type="radio" id="ng" name="availability" value="B">
                        <label for="ng">B：対応不可</label>
                    </div>
                </div>

                <div class="field">
                    <label for="message" class="label">メッセージ<span class="optional">（任意）</span></label>
                    <textarea id="message" name="message" placeholder="例：2分ほどで伺います"></textarea>
                    <!-- エラーや説明を出したい場合
          <p class="help error">メッセージは200文字以内で入力してください。</p> -->
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-primary" id="submitBtn" disabled>送信</button>
                    <!-- 予備のキャンセルなどがあれば追加
          <button type="button" class="btn" onclick="history.back()">キャンセル</button> -->
                </div>
            </form>
        </div>
    </div>

    <script>
        // 選択されるまで送信を無効化（任意。機能は保持）
        const form = document.getElementById('visitForm');
        const radios = form.querySelectorAll('input[name="availability"]');
        const submitBtn = document.getElementById('submitBtn');

        function updateState() {
            const checked = form.querySelector('input[name="availability"]:checked');
            submitBtn.disabled = !checked;
        }
        radios.forEach(r => r.addEventListener('change', updateState));
        updateState();

        // 既存バリデーションと競合させないため、ここではHTML標準に合わせてそのまま送信
        form.addEventListener('submit', (e) => {
            // 必要ならカスタム検証を書く（例：文字数制限）
            // const msg = document.getElementById('message').value;
            // if(msg.length > 200){ e.preventDefault(); alert('メッセージは200文字以内で入力してください。'); }
        });
    </script>
</body>

</html>
