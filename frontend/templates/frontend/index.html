{% extends "frontend/base.html" %}

{% block title %}来客受付システム - タプコ{% endblock %}

{% block content %}
<div class="container-wide">
    <div class="text-center mb-5">
        <h1 class="display-4 m-4" style="color: var(--navy);">ようこそ大原学園へ</h1>
        <h4 class="lead" style="color: var(--black);">来訪目的を選択してください</h4>
    </div>

    <div class="d-flex justify-content-center gap-4 flex-wrap button-container">
        <style>
            .btn-appointment {
                background-color: var(--black) !important;
                color: var(--white) !important;
            }

            .btn-no-appointment {
                background-color: var(--black) !important;
                color: var(--white) !important;
            }
        </style>

        <a href="{% url 'frontend:visitor_info' %}?visit_type=appointment"
            class="btn choice-btn tall-btn btn-appointment">アポイントあり</a>

        <a href="{% url 'frontend:visitor_info' %}?visit_type=no-appointment"
            class="btn choice-btn tall-btn btn-no-appointment">アポイントなし(要件入力)</a>
    </div>
</div>
{% endblock %}
